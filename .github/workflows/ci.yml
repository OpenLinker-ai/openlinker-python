name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]' build

      - name: Check public documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.zh-CN.md
          test -f PARITY.md
          test -f PARITY.zh-CN.md
          ! grep -n -E 'OPENLINKER_CORE_URL|OPENLINKER_RUNTIME_CERT([^_]|$)|OPENLINKER_RUNTIME_KEY([^_]|$)|OPENLINKER_RUNTIME_CA([^_]|$)' +            README.md README.zh-CN.md

      - name: Lint
        run: python -m ruff check .

      - name: Check bytecode compilation
        run: python -m compileall -q src

      - name: Test
        run: python -m pytest

      - name: Build distributions
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          for artifact in dist/*; do
            sha256sum "${artifact}" > "${artifact}.sha256"
          done

      - name: Upload packaged distributions
        if: github.ref_type == 'tag' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: openlinker-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release distributions
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged distributions
        uses: actions/download-artifact@v8
        with:
          name: openlinker-python-distributions
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --generate-notes
          fi
          gh release upload "${tag}" dist/* --clobber
